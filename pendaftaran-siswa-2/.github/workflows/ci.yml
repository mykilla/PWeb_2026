name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes" }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", extensions: mysqli, mbstring, curl, fileinfo }
      - name: Lint
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit test (logika murni)
        run: php tests/run.php
      - name: End-to-end
        run: |
          mysql -h127.0.0.1 -uroot < database.sql
          printf "APP_ENV=local\nDB_HOST=127.0.0.1\nDB_USER=root\nPAYMENT_DRIVER=mock\n" > .env
          php -S 127.0.0.1:8080 -t . > /dev/null 2>&1 &
          sleep 2
          bash tests/e2e.sh
